name: CI, Typecheck & Security Audit Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Build, Typecheck & Security Isolation Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Shared TypeScript Libraries
        run: pnpm run typecheck:libs

      - name: Typecheck Backend & Frontend
        run: |
          pnpm --filter @workspace/api-server run typecheck
          pnpm --filter @workspace/court-session-management run typecheck

      - name: Run Automated Security & Multi-Tenant Isolation Suite
        run: pnpm run test

      - name: Production Bundle Verification
        run: pnpm run build

